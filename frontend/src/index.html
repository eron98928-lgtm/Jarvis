<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - Interface</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #header {
            padding: 10px 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #status-indicator {
            font-size: 0.8em;
            color: #00ff00;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 5px;
            line-height: 1.4;
        }
        .user-message {
            align-self: flex-end;
            background-color: #1a1a1a;
            border: 1px solid #444;
        }
        .jarvis-message {
            align-self: flex-start;
            background-color: #001a33;
            border: 1px solid #004080;
        }
        #input-container {
            padding: 20px;
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            background-color: #111;
            border: 1px solid #444;
            color: #fff;
            padding: 12px;
            border-radius: 4px;
            outline: none;
        }
        input:focus {
            border-color: #007bff;
        }
        button {
            background-color: #004080;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .module-tag {
            font-size: 0.7em;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div id="header">
        <div>JARVIS <span style="font-size: 0.6em; color: #666;">v1.0</span></div>
        <div id="status-indicator">● ONLINE | MÓDULO: CORE</div>
    </div>
    <div id="chat-container">
        <div class="message jarvis-message">
            <div class="module-tag">System</div>
            Olá, Sr. Eron. Sistema JARVIS inicializado. Como posso ajudar hoje?
        </div>
    </div>
    <div id="input-container">
        <input type="text" id="user-input" placeholder="Digite seu comando..." autocomplete="off">
        <button onclick="sendMessage()">ENVIAR</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('user', text);
            userInput.value = '';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                appendMessage('jarvis', data.response);
            } catch (error) {
                appendMessage('jarvis', 'Erro na comunicação com o servidor.');
            }
        }

        function appendMessage(sender, text) {
            const div = document.createElement('div');
            div.className = `message ${sender}-message`;
            const tag = sender === 'user' ? 'Você' : 'JARVIS';
            div.innerHTML = `<div class="module-tag">${tag}</div>${text}`;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
